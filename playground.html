<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v-scroll-into-view Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #f8fafc;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    button {
      padding: 0.5rem 1rem;
      border: 1px solid #334155;
      border-radius: 0.375rem;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #334155; border-color: #475569; }
    button:active { background: #475569; }

    select {
      padding: 0.5rem 0.75rem;
      border: 1px solid #334155;
      border-radius: 0.375rem;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.875rem;
      cursor: pointer;
    }

    label {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      align-items: flex-start;
    }

    .scroll-container {
      width: 100%;
      max-width: 420px;
      height: 350px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      background: #1e293b;
    }

    .item {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid #1a2332;
      font-size: 0.875rem;
      transition: background 0.2s, color 0.2s;
      color: #94a3b8;
    }
    .item:last-child { border-bottom: none; }

    .item.active {
      background: #2563eb;
      color: #ffffff;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #334155;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

<div id="app">
  <h1>v-scroll-into-view</h1>
  <span class="badge">playground</span>

  <div class="controls">
    <button @click="prev">Prev</button>
    <button @click="next">Next</button>
    <button @click="randomJump">Random</button>

    <div class="option-group">
      <label>behavior</label>
      <select v-model="behavior">
        <option value="smooth">smooth</option>
        <option value="instant">instant</option>
        <option value="auto">auto</option>
      </select>
    </div>

    <div class="option-group">
      <label>block</label>
      <select v-model="block">
        <option value="nearest">nearest</option>
        <option value="start">start</option>
        <option value="center">center</option>
        <option value="end">end</option>
      </select>
    </div>
  </div>

  <div class="scroll-container">
    <div
      v-for="(item, index) in items"
      :key="item.id"
      class="item"
      :class="{ active: index === activeIndex }"
      v-scroll-into-view="{ condition: index === activeIndex, behavior, block }"
    >
      {{ item.label }}
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js"
  }
}
</script>
<script type="module">
import { createApp, ref } from 'vue'

// ---- Inline directive ----
// A hand-written MINIATURE of the package, not the package: no `container`, no
// `offset`, no reduced-motion default, and the pre-1.2.0 `nearest` behaviour.
// It exists so this file works from a CDN with no build step. The exhibit that
// runs the real source is `../playground` — use that one to judge behaviour.
const stateMap = new WeakMap()

function resolveBinding(value) {
  if (typeof value === 'boolean') return { condition: value, behavior: 'smooth', block: 'nearest', inline: 'nearest', always: false }
  if (value === undefined) return { condition: true, behavior: 'smooth', block: 'nearest', inline: 'nearest', always: false }
  return {
    condition: value.condition ?? true,
    behavior: value.behavior ?? 'smooth',
    block: value.block ?? 'nearest',
    inline: value.inline ?? 'nearest',
    always: value.always ?? false,
  }
}

function doScroll(el, opts) {
  const state = stateMap.get(el)
  if (!state) return
  if (state.pendingRaf !== undefined) cancelAnimationFrame(state.pendingRaf)
  state.pendingRaf = requestAnimationFrame(() => {
    state.pendingRaf = undefined
    el.scrollIntoView({ behavior: opts.behavior, block: opts.block, inline: opts.inline })
  })
}

const vScrollIntoView = {
  mounted(el, binding) {
    const opts = resolveBinding(binding.value)
    stateMap.set(el, { previousCondition: opts.condition, pendingRaf: undefined })
    if (opts.condition) doScroll(el, opts)
  },
  updated(el, binding) {
    const opts = resolveBinding(binding.value)
    const state = stateMap.get(el)
    if (!state) return
    const prev = state.previousCondition
    state.previousCondition = opts.condition
    if (!opts.condition) return
    if (opts.always || !prev) doScroll(el, opts)
  },
  unmounted(el) {
    const state = stateMap.get(el)
    if (state) {
      if (state.pendingRaf !== undefined) cancelAnimationFrame(state.pendingRaf)
      stateMap.delete(el)
    }
  },
}

// ---- App ----
const ITEM_COUNT = 50

const app = createApp({
  setup() {
    const items = Array.from({ length: ITEM_COUNT }, (_, i) => ({
      id: i,
      label: `Item ${i + 1}`,
    }))

    const activeIndex = ref(0)
    const behavior = ref('smooth')
    const block = ref('nearest')

    const next = () => { activeIndex.value = (activeIndex.value + 1) % ITEM_COUNT }
    const prev = () => { activeIndex.value = (activeIndex.value - 1 + ITEM_COUNT) % ITEM_COUNT }
    const randomJump = () => { activeIndex.value = Math.floor(Math.random() * ITEM_COUNT) }

    return { items, activeIndex, behavior, block, next, prev, randomJump }
  },
})

app.directive('scroll-into-view', vScrollIntoView)
app.mount('#app')
</script>
</body>
</html>
